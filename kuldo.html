<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Küldő – The Market Structure</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.webp">
<style>
:root{--bg:#060807;--bg-2:#0c110e;--line:#1a241e;--fg:#f2f5f3;--muted:#98a69d;--green:#3CFF3C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#dfe6e1;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 60px}
h1{font-size:1.5rem;color:var(--fg);margin:0 0 6px}
.muted{color:var(--muted);font-size:.9rem}
label{display:block;margin:16px 0 4px;font-weight:700}
input{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;font:inherit}
button{margin-top:18px;background:var(--green);color:#041004;font-weight:800;border:0;border-radius:999px;padding:.8em 1.4em;font:inherit;cursor:pointer}
.box{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:12px 16px;margin:18px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Belső küldő</h1>
<p class="muted">Ez az oldal a csapat belső eszköze. A webhook-linkek csak ebben a böngészőben tárolódnak, a szerverre és máshova nem kerülnek.</p>
<div class="box" id="allapot">…</div>
<form id="f">
<label for="bejelentesek">#bejelentések webhook</label>
<input id="bejelentesek" type="password" autocomplete="off" placeholder="beállítva: hagyd üresen, ha nem változik">
<label for="makrogazdagsag">#makrogazdaság webhook</label>
<input id="makrogazdagsag" type="password" autocomplete="off" placeholder="beállítva: hagyd üresen, ha nem változik">
<label for="axentiq">Axentiq-csatorna webhook</label>
<input id="axentiq" type="password" autocomplete="off" placeholder="beállítva: hagyd üresen, ha nem változik">
<button type="submit">Mentés ebbe a böngészőbe</button>
</form>
</div>
<script>
(function(){
  var K = "tms_webhooks", CS = ["bejelentesek", "makrogazdagsag", "axentiq"], JO = /^https:\/\/discord\.com\/api\/webhooks\/\d+\/[\w-]+$/;
  function olvas(){ try { return JSON.parse(localStorage.getItem(K) || "{}"); } catch(e) { return {}; } }
  function allapot(){ var h = olvas(), o = {}; CS.forEach(function(c){ o[c] = JO.test(h[c] || ""); }); return o; }
  function mutat(){
    var a = allapot();
    document.getElementById("allapot").textContent = CS.map(function(c){ return (a[c] ? "✓ " : "✗ ") + "#" + c; }).join("   ");
  }
  function darabol(t, n){
    var out = [], cur = "";
    t.split("\n\n").forEach(function(b){
      if (cur && cur.length + b.length + 2 > n) { out.push(cur); cur = b; } else { cur = cur ? cur + "\n\n" + b : b; }
    });
    if (cur) out.push(cur);
    return out;
  }
  // Az ütemezett körök ezt hívják: await tmsKuld("bejelentesek", szoveg) -> {ok, ids, csatorna} vagy {ok:false, hiba}
  window.tmsAllapot = allapot;
  window.tmsKuld = async function(csatorna, szoveg){
    var u = olvas()[csatorna];
    if (!JO.test(u || "")) return { ok: false, hiba: "nincs webhook ehhez a csatornához ebben a böngészőben", csatorna: csatorna };
    var ids = [];
    for (var p of darabol(String(szoveg), 1900)) {
      var r = await fetch(u + "?wait=true", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: p, username: "TheMarketStructure", allowed_mentions: { parse: p.indexOf("@everyone") >= 0 ? ["everyone"] : [] } }) });
      if (!r.ok) return { ok: false, status: r.status, ids: ids, csatorna: csatorna };
      ids.push((await r.json()).id);
    }
    return { ok: true, ids: ids, csatorna: csatorna };
  };
  // Saját üzenet törlése (csak Máté jóváhagyásával): await tmsTorol("bejelentesek", "<üzenet-id>")
  window.tmsTorol = async function(csatorna, id){
    var u = olvas()[csatorna];
    if (!JO.test(u || "")) return { ok: false, hiba: "nincs webhook", csatorna: csatorna };
    var r = await fetch(u + "/messages/" + encodeURIComponent(id), { method: "DELETE" });
    return { ok: r.status === 204, status: r.status, id: id };
  };
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var h = olvas(), hiba = [];
    CS.forEach(function(c){
      var v = document.getElementById(c).value.trim();
      if (!v) return;
      if (JO.test(v)) h[c] = v; else hiba.push("#" + c);
      document.getElementById(c).value = "";
    });
    try { localStorage.setItem(K, JSON.stringify(h)); } catch(e) { hiba.push("a böngésző nem enged tárolni"); }
    mutat();
    if (hiba.length) document.getElementById("allapot").textContent += "   (nem jó link: " + hiba.join(", ") + ")";
  });
  mutat();
})();
</script>
</body>
</html>
